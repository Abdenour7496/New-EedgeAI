worker_processes 1;
events { worker_connections 256; }

# The Buzz relay resolves which "community" a request belongs to by matching
# the Host header against a single hard-coded row (communities.host) that got
# set to whatever host the Buzz desktop/web client first connected through —
# in this stack, "localhost:3010". Anything connecting via the docker-internal
# hostname ("buzz:3000") gets a 404 even though the relay itself is reachable
# fine. This proxy exists purely to rewrite the Host header for our own
# server-side clients (buzz-acp, buzz-cli) so they resolve to the same
# community — it changes nothing about how the desktop/web client connects.
http {
    server {
        # 3010 to match the canonical "localhost:3010" identity — see the
        # extra_hosts override in docker-compose.unified.yml (buzz-agent-bridge
        # dials ws://localhost:3010 and needs that name to actually route here).
        listen 3010;

        location / {
            proxy_pass http://buzz:3000;
            proxy_http_version 1.1;
            proxy_set_header Host localhost:3010;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
    }
}
