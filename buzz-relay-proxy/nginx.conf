worker_processes 1;
events { worker_connections 256; }

# The Buzz relay resolves which "community" a request belongs to by matching
# the Host header against a single hard-coded row (communities.host), and its
# NIP-98 HTTP-bridge auth (used by /query and /events) checks the signed
# request URL against that same host with NO localhost/127.0.0.1 aliasing
# (unlike NIP-42 WS auth, which does alias them). Buzz Desktop itself is
# internally inconsistent about which of the two it uses — its native-agent
# runtime (buzz-acp) always dials via 127.0.0.1 regardless of configured
# relay_url, while its onboarding/profile module hardcodes localhost — so no
# single canonical host satisfies every part of the app — confirmed live on
# 2026-08-03 in both directions: under 127.0.0.1, the onboarding/profile-save
# call 401s (hardcoded to sign against localhost regardless of relay_url
# config); under localhost, native agents' ordinary /query and /events calls
# 401 instead (buzz-acp's native-agent runtime is separately hardcoded to
# dial 127.0.0.1). Canonical host is currently "127.0.0.1:3010" — chose
# agents working over onboarding, since onboarding only blocks new/unmigrated
# identities while broken agents block everything the app is actually used
# for. See RELAY_URL comment on buzz-migrate in docker-compose.unified.yml.
# Anything connecting via
# the docker-internal hostname ("buzz:3000") gets a 404 even though the relay
# itself is reachable fine. This proxy exists to rewrite the Host header to
# the canonical value for every client — host-side (browser, Buzz Desktop,
# native agents) and server-side (buzz-agent-bridge, which shares this
# container's network namespace — see its network_mode in
# docker-compose.unified.yml) — so they all resolve to the same community.
http {
    # Docker's embedded DNS server — re-resolve "buzz" on this TTL instead of
    # once at nginx startup. Without this, a static `proxy_pass http://buzz:3000`
    # bakes in whatever IP "buzz" had when nginx last started/reloaded; every
    # time the buzz container gets recreated (new IP on the bridge network)
    # nginx keeps sending traffic to the old, now-dead address until it's
    # restarted by hand — surfaces as a 502 from this proxy.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 3010;

        location / {
            set $buzz_upstream buzz:3000;
            proxy_pass http://$buzz_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:3010;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
    }

    # TLS listener for host-side clients (browser, Buzz Desktop, and Desktop's
    # spawned native agents) — not currently published to the host (see the
    # ports comment on buzz-relay-proxy in docker-compose.unified.yml for why).
    # Self-signed cert for localhost/127.0.0.1, generated once under ./certs.
    server {
        listen 3443 ssl;
        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        location / {
            set $buzz_upstream buzz:3000;
            proxy_pass http://$buzz_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:3010;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
    }
}
