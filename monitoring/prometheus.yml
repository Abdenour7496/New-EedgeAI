
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'proxy'
    metrics_path: /metrics
    static_configs:
      - targets: ['proxy:5001']

  - job_name: 'graphiti'
    metrics_path: /metrics
    static_configs:
      - targets: ['graphiti:8000']

  - job_name: 'falkordb'
    static_configs:
      - targets: ['falkordb-exporter:9121']

  - job_name: 'openclaw'
    metrics_path: /metrics
    static_configs:
      - targets: ['openclaw:9091']
