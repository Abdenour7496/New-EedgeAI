# Host-header rewrite proxy for graphiti-mcp.
#
# The zepai/knowledge-graph-mcp image builds its FastMCP server without a
# custom `transport_security` setting, so the MCP Python SDK falls back to
# its hardcoded DNS-rebinding allowlist: only Host headers of
# "localhost:*" / "127.0.0.1:*" / "[::1]:*" are accepted. Every real client
# on the Compose network reaches it as "graphiti-mcp:8000", which isn't in
# that list, so every request was rejected with 421 Misdirected Request
# (see docs/adr/0001-graphiti-falkordb-backend.md validation notes). This
# sidecar sits in front of graphiti-mcp and rewrites the Host header to
# something the allowlist accepts, without touching the vendored image.
resolver 127.0.0.11 valid=10s;

server {
    listen 8000;
    listen [::]:8000;

    location / {
        set $upstream http://graphiti-mcp:8000;
        proxy_pass $upstream;
        proxy_set_header Host localhost:8000;
        proxy_http_version 1.1;
        # The MCP streamable-HTTP transport keeps connections open for
        # SSE/chunked responses; don't buffer or time them out early.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
