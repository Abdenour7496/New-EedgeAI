x-neo4j-credentials: &neo4j-creds
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-test1234}

services:

  # ── Data stores ───────────────────────────────────────────────────────────────

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-test1234}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  neo4j-exporter:
    build: ./neo4j-exporter
    environment:
      <<: *neo4j-creds
      NEO4J_DATABASE: neo4j
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Ollama (local LLM) ────────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to enable NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull ${OLLAMA_MODEL:-llama3.2} &&
        ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text} &&
        ollama pull ${OLLAMA_VISION_MODEL:-llava:7b}
    restart: "no"

  # ── MCP servers (SSE) — expose graph + vector DBs to OpenClaw ─────────────────

  mcp-qdrant:
    build: ./mcp-servers/qdrant
    environment:
      <<: *neo4j-creds
      QDRANT_URL: http://qdrant:6333
      COLLECTION_NAME: ${QDRANT_COLLECTION:-documents}
      QDRANT_MCP_HOST: 0.0.0.0
      QDRANT_MCP_PORT: "8765"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # Embedding backend — must match proxy to avoid dimension mismatch
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      DEFAULT_ACCESS_LEVEL: ${DEFAULT_ACCESS_LEVEL:-public}
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  mcp-neo4j:
    build: ./mcp-servers/neo4j
    environment:
      <<: *neo4j-creds
      NEO4J_DATABASE: neo4j
      NEO4J_MCP_SERVER_HOST: 0.0.0.0
      NEO4J_MCP_SERVER_PORT: "8766"
      DEFAULT_ACCESS_LEVEL: ${DEFAULT_ACCESS_LEVEL:-public}
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  openclaw-config-init:
    image: alpine:3.20
    command:
      - /bin/sh
      - -lc
      - |
        mkdir -p /config
        cp /seed/openclaw.json /config/openclaw.json
        chown -R 1000:1000 /config
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-openclaw_config}:/config
      - ./openclaw-config/openclaw.json:/seed/openclaw.json:ro
    restart: "no"

  # ── OpenClaw + relay ──────────────────────────────────────────────────────────

  openclaw:
    build:
      context: .
      dockerfile: openclaw/Dockerfile
    depends_on:
      openclaw-config-init:
        condition: service_completed_successfully
      mcp-qdrant:
        condition: service_started
      mcp-neo4j:
        condition: service_started
    ports:
      - "18789:18789"
      - "18799:18799"
      - "18801:18801"
      - "9091:9091"
    environment:
      <<: *neo4j-creds
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      COPILOT_API_KEY: ${COPILOT_API_KEY:-}
      COPILOT_GITHUB_TOKEN: ${COPILOT_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      OPENCLAW_BRIDGE_PORT: ${OPENCLAW_BRIDGE_PORT:-18790}
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND:-lan}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_DOCKER_APT_PACKAGES: ${OPENCLAW_DOCKER_APT_PACKAGES:-}
      OPENCLAW_DISABLE_BONJOUR: "true"
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-openclaw_config}:/home/node/.openclaw
      - ./openclaw-config/openclaw.json:/opt/openclaw-seed/openclaw.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/18799' || exit 0"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── GCOR Proxy ────────────────────────────────────────────────────────────────

  proxy:
    build: ./proxy
    ports:
      - "5001:5001"
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      <<: *neo4j-creds
      # LLM backend — openai | anthropic | ollama | openclaw | copilot
      LLM_BACKEND: ${LLM_BACKEND:-anthropic}
      VISION_BACKEND: ${VISION_BACKEND:-anthropic}
      VISION_MODEL: ${VISION_MODEL:-claude-3-5-sonnet-20241022}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-claude-haiku-4-5-20251001}
      # GitHub Copilot
      COPILOT_API_KEY: ${COPILOT_API_KEY:-}
      COPILOT_BASE_URL: ${COPILOT_BASE_URL:-https://api.githubcopilot.com}
      COPILOT_CHAT_MODEL: ${COPILOT_CHAT_MODEL:-gpt-4.1}
      # Ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # Embedding
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # Qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}
      QDRANT_TOP_K: ${QDRANT_TOP_K:-8}
      # OpenClaw backend
      OPENCLAW_BASE_URL: ${OPENCLAW_BASE_URL:-http://openclaw:18799/v1}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      # RAG switch
      ENABLE_RAG: ${ENABLE_RAG:-true}
      # Cognitive infrastructure
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.0}
      AGENT_ID: ${AGENT_ID:-}
      DEFAULT_ACCESS_LEVEL: ${DEFAULT_ACCESS_LEVEL:-public}
      # Buzz knowledge bridge — /v1/buzz/chat/completions stays closed (503) unless
      # BUZZ_BRIDGE_API_KEY is set, so this is a no-op for the default (non-buzz) stack.
      BUZZ_BRIDGE_API_KEY: ${BUZZ_BRIDGE_API_KEY:-}
      BUZZ_ALLOWED_COLLECTIONS: ${BUZZ_ALLOWED_COLLECTIONS:-}
      # Document storage (MinIO) — best-effort; ingestion still works if unset/unreachable.
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      S3_SECRET_KEY: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
      S3_BUCKET: ${DOCS_S3_BUCKET:-documents}
    volumes:
      - ./proxy/main.py:/app/main.py:ro
      - ./proxy/document_intel.py:/app/document_intel.py:ro
      - ./proxy/templates:/app/templates:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Document storage (MinIO, S3-compatible) ───────────────────────────────────

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      MINIO_ROOT_PASSWORD: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
    volumes:
      - docs_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      DOCS_S3_ACCESS_KEY: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      DOCS_S3_SECRET_KEY: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
      DOCS_S3_BUCKET: ${DOCS_S3_BUCKET:-documents}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${DOCS_S3_ACCESS_KEY}" "$${DOCS_S3_SECRET_KEY}"
        && mc mb --ignore-existing "local/$${DOCS_S3_BUCKET}"
        && mc anonymous set none "local/$${DOCS_S3_BUCKET}"
    restart: "no"

  # Polls documents/inbox/ and pushes new files into the proxy's /api/ingest —
  # see ingest-watcher/watcher.py for why this exists instead of a webhook.
  ingest-watcher:
    build: ./ingest-watcher
    depends_on:
      minio-init:
        condition: service_completed_successfully
      proxy:
        condition: service_healthy
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      S3_SECRET_KEY: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
      S3_BUCKET: ${DOCS_S3_BUCKET:-documents}
      S3_INBOX_PREFIX: inbox/
      S3_PROCESSED_PREFIX: processed/
      S3_FAILED_PREFIX: failed/
      PROXY_INGEST_URL: http://proxy:5001/api/ingest
      POLL_INTERVAL_SECONDS: ${INGEST_WATCH_INTERVAL_SECONDS:-10}
      INGEST_COLLECTION: ${QDRANT_COLLECTION:-documents}
      INGEST_ENABLE_DOCINT: ${INGEST_ENABLE_DOCINT:-false}
      INGEST_ACCESS_LEVEL: ${DEFAULT_ACCESS_LEVEL:-public}
    restart: unless-stopped

  # ── TTS (OpenAI-compatible Edge TTS) ─────────────────────────────────────────

  tts:
    image: travisvn/openai-edge-tts:latest
    ports:
      - "5050:5050"
    environment:
      PORT: "5050"
      API_KEY: ${TTS_API_KEY:-tts-local}
      REQUIRE_API_KEY: "true"
      DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-en-US-AriaNeural}
      DEFAULT_RESPONSE_FORMAT: ${TTS_DEFAULT_FORMAT:-mp3}
      DEFAULT_SPEED: ${TTS_DEFAULT_SPEED:-1.0}
    restart: unless-stopped

  # ── OpenWebUI ─────────────────────────────────────────────────────────────────

  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.10.2
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_BASE_URL: http://proxy:5001/v1
      OPENAI_API_KEY: openclaw
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: http://proxy:5001/v1
      RAG_OPENAI_API_KEY: openclaw
      ENABLE_RAG_LOCAL_WEB_FETCH: "false"
      # Ollama — fallback model when Anthropic is unavailable
      OLLAMA_BASE_URL: http://ollama:11434
      DEFAULT_MODELS: openclaw
      DEFAULT_USER_ROLE: user
      ENABLE_MODEL_FILTER: "false"
      # TTS — OpenAI-compatible Edge TTS
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://tts:5050/v1
      AUDIO_TTS_OPENAI_API_KEY: ${TTS_API_KEY:-tts-local}
      AUDIO_TTS_MODEL: tts-1
      AUDIO_TTS_VOICE: ${TTS_DEFAULT_VOICE:-en-US-AriaNeural}
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      proxy:
        condition: service_healthy
      ollama:
        condition: service_healthy
      tts:
        condition: service_started

  # ── Buzz — human and agent collaboration relay (opt in: --profile buzz) ────

  buzz-postgres:
    image: postgres:17-alpine
    profiles: ["buzz"]
    environment:
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: ${BUZZ_POSTGRES_PASSWORD:-buzz_dev}
      POSTGRES_DB: buzz
    volumes:
      - buzz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz -d buzz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  buzz-redis:
    image: redis:7-alpine
    profiles: ["buzz"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - buzz_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  buzz-minio:
    image: minio/minio:latest
    profiles: ["buzz"]
    command: server /data
    environment:
      MINIO_ROOT_USER: ${BUZZ_S3_ACCESS_KEY:-buzz_dev}
      MINIO_ROOT_PASSWORD: ${BUZZ_S3_SECRET_KEY:-buzz_dev_secret}
    volumes:
      - buzz_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  buzz-minio-init:
    image: minio/mc:latest
    profiles: ["buzz"]
    depends_on:
      buzz-minio:
        condition: service_healthy
    environment:
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:-buzz_dev}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:-buzz_dev_secret}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://buzz-minio:9000 "$${BUZZ_S3_ACCESS_KEY}" "$${BUZZ_S3_SECRET_KEY}"
        && mc mb --ignore-existing "local/$${BUZZ_S3_BUCKET}"
        && mc anonymous set none "local/$${BUZZ_S3_BUCKET}"
    restart: "no"

  buzz-migrate:
    image: ghcr.io/block/buzz:latest
    profiles: ["buzz"]
    entrypoint: ["/usr/local/bin/buzz-admin"]
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://buzz:${BUZZ_POSTGRES_PASSWORD:-buzz_dev}@buzz-postgres:5432/buzz
      # Needed for `docker compose run buzz-migrate add-member/remove-member`
      # (buzz-admin signs the membership roster with the relay's own key, and
      # needs RELAY_URL to resolve which community/workspace to operate on —
      # the internal docker hostname, not the host-published localhost:3010).
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY:-}
      # Must match the `buzz` service's own RELAY_URL exactly (community rows are
      # keyed by that string at seed time) — not the docker-internal hostname.
      RELAY_URL: ${BUZZ_RELAY_URL:-ws://localhost:3010}
    depends_on:
      buzz-postgres:
        condition: service_healthy
    restart: "no"

  buzz:
    image: ghcr.io/block/buzz:latest
    profiles: ["buzz"]
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: postgres://buzz:${BUZZ_POSTGRES_PASSWORD:-buzz_dev}@buzz-postgres:5432/buzz
      REDIS_URL: redis://buzz-redis:6379
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      RELAY_URL: ${BUZZ_RELAY_URL:-ws://localhost:3010}
      BUZZ_S3_ENDPOINT: http://buzz-minio:9000
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:-buzz_dev}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:-buzz_dev_secret}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
      BUZZ_GIT_REPO_PATH: /data/git
      # Stable signing key for the relay's own identity (kind:13534 membership
      # rosters, etc.). Documented in .env.example but was never actually wired
      # through here — without it the relay signs with a fresh ephemeral keypair
      # every restart, which breaks buzz-admin add-member/remove-member.
      BUZZ_RELAY_PRIVATE_KEY: ${BUZZ_RELAY_PRIVATE_KEY:-}
    volumes:
      - buzz_git_data:/data/git
    depends_on:
      buzz-redis:
        condition: service_healthy
      buzz-minio-init:
        condition: service_completed_successfully
      buzz-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/_readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Rewrites the Host header to whatever the buzz service's single community row
  # is keyed to (see buzz-relay-proxy/nginx.conf) so server-side clients on the
  # internal docker network (buzz-agent-bridge, ad-hoc buzz-cli calls) resolve to
  # the same community the desktop/web client uses — without touching that
  # client's own connection at all.
  buzz-relay-proxy:
    image: nginx:alpine
    profiles: ["buzz"]
    volumes:
      - ./buzz-relay-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      default: {}
      buzz_bridge_net:
        ipv4_address: 172.29.42.10
    depends_on:
      buzz:
        condition: service_healthy
    restart: unless-stopped

  # Bridges a Buzz channel to the GCOR knowledge base: joins as its own agent
  # identity, watches the channels listed in BUZZ_ACP_CHANNELS, and on a mention
  # answers via the proxy's authenticated /v1/buzz/chat/completions route (full
  # GCOR retrieval — Qdrant + Neo4j), posting the reply back into the channel.
  # The agent_command is our own reply_adapter.py, not an LLM tool-calling loop:
  # it deterministically calls the proxy and always posts the answer via
  # `buzz messages send` — there's no LLM-driven decision to run anything else,
  # so the model can't take any action beyond answering the question that
  # reached it. See buzz-bridge/reply_adapter.py for why (buzz-agent + a shell
  # tool answered questions but often never chose to call the "post" tool).
  buzz-agent-bridge:
    build:
      context: ./buzz-bridge
    profiles: ["buzz"]
    # buzz-acp signs its NIP-42 auth event with a "relay" tag equal to whatever
    # --relay-url it was given, and the server requires that to match its own
    # configured self-identity (ws://localhost:3010) — not just be *reachable*.
    # So this has to literally say localhost:3010, and extra_hosts + the static
    # IP on buzz_bridge_net make that name route to buzz-relay-proxy instead of
    # this container's own loopback (which has nothing listening on 3010).
    extra_hosts:
      - "localhost:172.29.42.10"
    networks:
      default: {}
      buzz_bridge_net: {}
    environment:
      # Required at runtime — validated by entrypoint.sh (not here: `${VAR:?}` would
      # break `docker compose config`/`up` for the *default* profile too, since
      # compose interpolates every service's env block regardless of --profile).
      BUZZ_RELAY_URL: ws://localhost:3010
      BUZZ_PRIVATE_KEY: ${BUZZ_AGENT_PRIVATE_KEY:-}
      BUZZ_ACP_CHANNELS: ${BUZZ_KNOWLEDGE_CHANNELS:-}
      BUZZ_ACP_SUBSCRIBE: mentions
      BUZZ_ACP_RESPOND_TO: ${BUZZ_ACP_RESPOND_TO:-anyone}
      # reply_adapter.py — deterministic agent (see its file header): always
      # calls the proxy and always posts the answer via `buzz messages send`,
      # no LLM-driven decision to (not) publish. Replaced buzz-agent + a shell
      # MCP tool after testing showed the model would answer the question but
      # frequently never choose to call the "post" tool.
      BUZZ_ACP_AGENT_COMMAND: /usr/local/bin/reply_adapter.py
      BUZZ_ACP_AGENT_ARGS: ""
      # idle_timeout must be < max_turn_duration (buzz-acp validates this at startup);
      # both tightened well below the 900s/7200s defaults since a single call to
      # the proxy should finish in seconds, not the default hour-plus.
      BUZZ_ACP_IDLE_TIMEOUT: 60
      BUZZ_ACP_MAX_TURN_DURATION: 120
      # Read directly by reply_adapter.py (not by buzz-agent anymore).
      OPENAI_COMPAT_BASE_URL: http://proxy:5001/v1/buzz
      OPENAI_COMPAT_API_KEY: ${BUZZ_BRIDGE_API_KEY:-}
    depends_on:
      buzz:
        condition: service_healthy
      buzz-relay-proxy:
        condition: service_started
      proxy:
        condition: service_healthy
    restart: unless-stopped

  # ── Monitoring ────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/dashboard.json
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

# Only buzz-relay-proxy and buzz-agent-bridge attach to buzz_bridge_net —
# everything else stays on the plain implicit default network, untouched.
# It exists purely so buzz-relay-proxy can have a static IP that
# buzz-agent-bridge can route to via its "localhost" override (see that
# service's extra_hosts) — a fixed subnet is required to pin an IP.
networks:
  buzz_bridge_net:
    ipam:
      config:
        - subnet: 172.29.42.0/24

volumes:
  neo4j_data:
  qdrant_data:
  openclaw_config:
  openwebui_data:
  ollama_data:
  docs_minio_data:
  buzz_postgres_data:
  buzz_redis_data:
  buzz_minio_data:
  buzz_git_data:
