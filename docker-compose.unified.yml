services:

  # ── Data stores ───────────────────────────────────────────────────────────────

  falkordb:
    image: falkordb/falkordb:latest
    # Bound to localhost only: this is the graph/vector store, not a public
    # surface — other containers reach it over the docker network by service
    # name regardless of host port bindings. Reach it from the host itself via
    # SSH tunnel / kubectl port-forward for the browser UI or redis-cli.
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3001:3000"
    environment:
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      REDIS_ARGS: --appendonly yes --appendfsync everysec
      BROWSER: "1"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g

  graphiti:
    build: ./graphiti
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENAI_BASE_URL: ${GRAPHITI_API_BASE_URL:-http://ollama:11434/v1}
      OPENAI_API_KEY: ${GRAPHITI_API_KEY:-ollama}
      MODEL_NAME: ${GRAPHITI_MODEL:-qwen2.5:7b}
      EMBEDDING_MODEL_NAME: ${GRAPHITI_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${GRAPHITI_EMBEDDING_DIM:-768}
      # Entity/edge extraction routed separately from embeddings, through
      # the proxy's /v1/openclaw passthrough (openclaw's Codex/Claude Code
      # CLI subscriptions, with the proxy's existing Ollama-on-failure
      # fallback — NOT the full GCOR RAG pipeline, which would corrupt
      # graphiti-core's own extraction prompts) — verified directly: local
      # qwen2.5:7b extraction failed to finish a real 6-message chat
      # transcript inside an 1800s budget; the same call via openclaw took
      # 8.8s. Embeddings above stay on Ollama regardless (openclaw's
      # gateway isn't an embeddings backend). See
      # docs/adr/0010-graphiti-openclaw-llm.md.
      GRAPHITI_LLM_BASE_URL: ${GRAPHITI_LLM_BASE_URL:-http://proxy:5001/v1/openclaw}
      GRAPHITI_LLM_API_KEY: ${GCOR_API_KEY:-}
      GRAPHITI_LLM_MODEL: ${GRAPHITI_LLM_MODEL:-openclaw}
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      # Was missing here even though graphiti/app.py reads it (falkordb_driver
      # password=os.getenv("FALKORDB_PASSWORD") or None) — meant this service
      # would fail to authenticate the moment FALKORDB_PASSWORD was ever set,
      # since only falkordb/graphiti-mcp/falkordb-exporter received it.
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      FALKORDB_DATABASE: ${FALKORDB_DATABASE:-eedgeai}
      db_backend: falkordb
      # Graphiti 0.22.0 marks these optional fields as required during settings
      # validation even for DB_BACKEND=falkordb. They are never connected to.
      NEO4J_URI: bolt://unused:7687
      NEO4J_USER: unused
      NEO4J_PASSWORD: unused
      GRAPHITI_TELEMETRY_ENABLED: "false"
      # Was 2, sized for local Ollama calls taking minutes each. Modest bump
      # now that a typical extraction call via openclaw takes ~8s instead —
      # kept conservative (not higher) since openclaw's own concurrency
      # headroom (Codex/Claude Code CLI subscriptions) hasn't been load
      # tested; raise further only after watching it hold up under real
      # concurrent ingest load.
      SEMAPHORE_LIMIT: ${GRAPHITI_SEMAPHORE_LIMIT:-4}
    depends_on:
      falkordb:
        condition: service_healthy
      ollama:
        condition: service_healthy
      openclaw:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g

  graphiti-mcp:
    image: zepai/knowledge-graph-mcp:standalone
    environment:
      CONFIG_PATH: /app/mcp/config/config.yaml
      OPENAI_API_URL: ${GRAPHITI_API_BASE_URL:-http://ollama:11434/v1}
      OPENAI_API_KEY: ${GRAPHITI_API_KEY:-ollama}
      MODEL_NAME: ${GRAPHITI_MODEL:-qwen2.5:7b}
      EMBEDDER_MODEL: ${GRAPHITI_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${GRAPHITI_EMBEDDING_DIM:-768}
      FALKORDB_URI: redis://falkordb:6379
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      FALKORDB_DATABASE: ${FALKORDB_DATABASE:-eedgeai}
      GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-documents}
      GRAPHITI_TELEMETRY_ENABLED: "false"
      SEMAPHORE_LIMIT: ${GRAPHITI_SEMAPHORE_LIMIT:-2}
    volumes:
      - ./graphiti-mcp/config.yaml:/app/mcp/config/config.yaml:ro
    depends_on:
      falkordb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g

  # Rewrites the Host header to something graphiti-mcp's DNS-rebinding
  # allowlist accepts (see graphiti-mcp/nginx.conf) — OpenClaw talks to this,
  # not to graphiti-mcp directly.
  graphiti-mcp-proxy:
    image: nginx:alpine
    volumes:
      - ./graphiti-mcp/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      graphiti-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  # ── Ollama (local LLM) ────────────────────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to enable NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Ollama is the heaviest CPU/RAM consumer in this stack — raise this
          # for larger models (see project_production_local_llm_goal memory /
          # the DeepSeek sizing discussion) and prefer the commented GPU block
          # above once running on GPU nodes.
          cpus: "4"
          memory: 12g

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull ${OLLAMA_MODEL:-llama3.2} &&
        ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text} &&
        ollama pull ${GRAPHITI_MODEL:-qwen2.5:7b} &&
        ollama pull ${OLLAMA_VISION_MODEL:-llava:7b}
    restart: "no"

  openclaw-config-init:
    image: alpine:3.20
    command:
      - /bin/sh
      - -lc
      - |
        mkdir -p /config
        cp /seed/openclaw.json /config/openclaw.json
        chown -R 1000:1000 /config
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-openclaw_config}:/config
      - ./openclaw-config/openclaw.json:/seed/openclaw.json:ro
    restart: "no"

  # ── OpenClaw + relay ──────────────────────────────────────────────────────────

  openclaw:
    build:
      context: .
      dockerfile: openclaw/Dockerfile
    depends_on:
      openclaw-config-init:
        condition: service_completed_successfully
      graphiti-mcp-proxy:
        condition: service_healthy
    # OpenClaw is an operator/agent-gateway surface, not the end-user product —
    # OpenWebUI is (see docs/adr/0002-proxy-api-authentication.md). Reach these
    # from the host via SSH tunnel / kubectl port-forward; proxy/openclaw talk
    # to it over the docker network regardless of host port bindings.
    ports:
      - "127.0.0.1:18789:18789"
      - "127.0.0.1:18799:18799"
      - "127.0.0.1:18801:18801"
      - "127.0.0.1:9091:9091"
    environment:
      # Deliberately NOT set here (unlike the proxy service, which has its own
      # copy for RAG/vision calls): the bundled `claude` CLI prefers
      # ANTHROPIC_API_KEY over an OAuth/subscription login whenever it's
      # present in the environment, silently ignoring `claude login` even
      # after it succeeds. Leaving this unset forces the claude-cli backend to
      # actually use the Claude Pro/Max subscription session instead of
      # metered API billing.
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Deliberately do not pass OPENAI_API_KEY here: the Codex runtime must use
      # OpenClaw's persisted ChatGPT/Codex OAuth profile, not metered API billing.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      OPENCLAW_BRIDGE_PORT: ${OPENCLAW_BRIDGE_PORT:-18790}
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND:-lan}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_DOCKER_APT_PACKAGES: ${OPENCLAW_DOCKER_APT_PACKAGES:-}
      OPENCLAW_DISABLE_BONJOUR: "true"
      GRAPHITI_URL: http://graphiti:8000
      GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-documents}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # Local embeddings remain independent of the conversational model chain.
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # Document storage (MinIO) for ingest-cli — best-effort, same as the
      # proxy's own copy of these vars; ingestion still works if unset/unreachable.
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      S3_SECRET_KEY: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
      S3_BUCKET: ${DOCS_S3_BUCKET:-documents}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-openclaw_config}:/home/node/.openclaw
      - ./openclaw-config/openclaw.json:/opt/openclaw-seed/openclaw.json:ro
      # Claude Code CLI's own login state (claude login) — separate from
      # OpenClaw's own config dir so the subscription auth survives restarts.
      - openclaw_claude_config:/home/node/.claude
      # Codex CLI's own login state (codex login) — same rationale.
      - openclaw_codex_config:/home/node/.codex
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/18799' || exit 0"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g

  # ── GCOR Proxy ────────────────────────────────────────────────────────────────

  proxy:
    build: ./proxy
    # Operator/ingest surface (Knowledge UI, direct curl) — OpenWebUI (8080) is
    # the end-user front door. Localhost-only by default; tunnel in for admin
    # use. OpenWebUI/Functions/ingest-watcher reach this over the docker
    # network regardless of the host port binding.
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      graphiti:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      # Shared secret required on /api/* and /v1/* — see
      # docs/adr/0002-proxy-api-authentication.md. Must match what's
      # configured on openwebui, ingest-watcher, and each gcor_* Function's
      # gcor_api_key valve.
      GCOR_API_KEY: ${GCOR_API_KEY:-}
      # OpenClaw routes Codex -> Claude Code -> local Ollama.
      LLM_BACKEND: ${LLM_BACKEND:-openclaw}
      VISION_BACKEND: ${VISION_BACKEND:-anthropic}
      VISION_MODEL: ${VISION_MODEL:-claude-3-5-sonnet-20241022}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llava:7b}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-claude-haiku-4-5-20251001}
      # Ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # Embedding
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # Graphiti temporal knowledge graph backed by FalkorDB
      GRAPHITI_URL: http://graphiti:8000
      GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-documents}
      GRAPHITI_TOP_K: ${GRAPHITI_TOP_K:-8}
      # Separate group for archived chat-session transcripts (POST /api/ingest/session),
      # kept apart from GRAPHITI_GROUP_ID so document RAG isn't diluted by conversation history.
      GRAPHITI_CHAT_SESSIONS_GROUP_ID: ${GRAPHITI_CHAT_SESSIONS_GROUP_ID:-chat_sessions}
      # How long the proxy waits for Graphiti extraction before erroring — CPU-only
      # local extraction can take several minutes per call (see README trade-offs).
      GRAPHITI_INGEST_TIMEOUT_SECONDS: ${GRAPHITI_INGEST_TIMEOUT_SECONDS:-1800}
      # OpenClaw backend
      OPENCLAW_BASE_URL: ${OPENCLAW_BASE_URL:-http://openclaw:18799/v1}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      # RAG switch
      ENABLE_RAG: ${ENABLE_RAG:-true}
      # Cognitive infrastructure
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.0}
      AGENT_ID: ${AGENT_ID:-}
      DEFAULT_ACCESS_LEVEL: ${DEFAULT_ACCESS_LEVEL:-public}
      # Document storage (MinIO) — best-effort; ingestion still works if unset/unreachable.
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      S3_SECRET_KEY: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
      S3_BUCKET: ${DOCS_S3_BUCKET:-documents}
    volumes:
      - ./proxy/main.py:/app/main.py:ro
      - ./proxy/document_intel.py:/app/document_intel.py:ro
      - ./proxy/governance.py:/app/governance.py:ro
      - ./proxy/templates:/app/templates:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  # ── Document storage (MinIO, S3-compatible) ───────────────────────────────────

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    # Admin/API surface, not for end users — bind locally, tunnel in for the
    # console; internal S3 traffic (proxy, ingest-watcher, openwebui) is over
    # the docker network and unaffected by this.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      MINIO_ROOT_PASSWORD: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
    volumes:
      - docs_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      DOCS_S3_ACCESS_KEY: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      DOCS_S3_SECRET_KEY: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
      DOCS_S3_BUCKET: ${DOCS_S3_BUCKET:-documents}
      OPENWEBUI_S3_BUCKET: ${OPENWEBUI_S3_BUCKET:-openwebui}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${DOCS_S3_ACCESS_KEY}" "$${DOCS_S3_SECRET_KEY}"
        && mc mb --ignore-existing "local/$${DOCS_S3_BUCKET}"
        && mc anonymous set none "local/$${DOCS_S3_BUCKET}"
        && mc mb --ignore-existing "local/$${OPENWEBUI_S3_BUCKET}"
        && mc anonymous set none "local/$${OPENWEBUI_S3_BUCKET}"
    restart: "no"

  # Polls documents/inbox/ and pushes new files into the proxy's /api/ingest —
  # see ingest-watcher/watcher.py for why this exists instead of a webhook.
  ingest-watcher:
    build: ./ingest-watcher
    depends_on:
      minio-init:
        condition: service_completed_successfully
      proxy:
        condition: service_healthy
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      S3_SECRET_KEY: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
      S3_BUCKET: ${DOCS_S3_BUCKET:-documents}
      S3_INBOX_PREFIX: inbox/
      S3_PROCESSED_PREFIX: processed/
      S3_FAILED_PREFIX: failed/
      PROXY_INGEST_URL: http://proxy:5001/api/ingest
      POLL_INTERVAL_SECONDS: ${INGEST_WATCH_INTERVAL_SECONDS:-10}
      INGEST_COLLECTION: ${GRAPHITI_GROUP_ID:-documents}
      INGEST_ENABLE_DOCINT: ${INGEST_ENABLE_DOCINT:-false}
      INGEST_ACCESS_LEVEL: ${DEFAULT_ACCESS_LEVEL:-public}
      # Must match the proxy's GCOR_API_KEY — see
      # docs/adr/0002-proxy-api-authentication.md.
      GCOR_API_KEY: ${GCOR_API_KEY:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  # ── TTS (OpenAI-compatible Edge TTS) ─────────────────────────────────────────

  tts:
    image: travisvn/openai-edge-tts:latest
    ports:
      - "127.0.0.1:5050:5050"
    environment:
      PORT: "5050"
      API_KEY: ${TTS_API_KEY:-tts-local}
      REQUIRE_API_KEY: "true"
      DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-en-US-AriaNeural}
      DEFAULT_RESPONSE_FORMAT: ${TTS_DEFAULT_FORMAT:-mp3}
      DEFAULT_SPEED: ${TTS_DEFAULT_SPEED:-1.0}
    restart: unless-stopped

  # ── OpenWebUI ─────────────────────────────────────────────────────────────────

  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.11.1
    # No longer the public port — `caddy` below is now the TLS front door end
    # users hit (see docs/adr/0006-tls-reverse-proxy.md). Bound to localhost
    # only, same as every other admin/operator surface in this stack; reach
    # it directly via SSH tunnel / kubectl port-forward for debugging.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Persistent signing key for session/JWT auth — without this OpenWebUI
      # generates a random one on every restart, invalidating every logged-in
      # session. Change the default before exposing this beyond a dev box.
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-changeme-set-a-real-secret}
      # Closed after the first admin account is created. OpenWebUI allows the
      # very first signup regardless of this setting so there's always a way
      # to bootstrap an admin; verify this against the pinned v0.11.1 behavior
      # before relying on it in production.
      ENABLE_SIGNUP: ${OPENWEBUI_ENABLE_SIGNUP:-false}
      # Also readable directly by the gcor_* Functions' Python code (they run
      # inside this container) so their `gcor_api_key` valve can default to it
      # automatically instead of every admin re-typing the secret per Function.
      GCOR_API_KEY: ${GCOR_API_KEY:-}
      OPENAI_API_BASE_URL: http://proxy:5001/v1
      # Real shared secret instead of the fixed string "openclaw" — must match
      # the proxy's GCOR_API_KEY.
      OPENAI_API_KEY: ${GCOR_API_KEY:-openclaw}
      RAG_EMBEDDING_ENGINE: openai
      RAG_OPENAI_API_BASE_URL: http://proxy:5001/v1
      RAG_OPENAI_API_KEY: ${GCOR_API_KEY:-openclaw}
      # Without this, OpenWebUI's own embedding_engine=openai still keeps its
      # stock local model id (sentence-transformers/all-MiniLM-L6-v2), which
      # doesn't exist in Ollama — the proxy forwards that name straight
      # through (EMBEDDING_BACKEND=ollama) and Ollama 404s. That breaks
      # OpenWebUI's native "attach a file to chat, ask about it" RAG flow
      # silently (the model reports nothing was attached) — see
      # docs/adr/0008-openwebui-embedding-model-mismatch.md. Must match
      # OLLAMA_EMBEDDING_MODEL below / on the proxy.
      RAG_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      ENABLE_RAG_LOCAL_WEB_FETCH: "false"
      # Ollama — fallback model when Anthropic is unavailable
      OLLAMA_BASE_URL: http://ollama:11434
      DEFAULT_MODELS: openclaw
      DEFAULT_USER_ROLE: user
      ENABLE_MODEL_FILTER: "false"
      # TTS — OpenAI-compatible Edge TTS
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://tts:5050/v1
      AUDIO_TTS_OPENAI_API_KEY: ${TTS_API_KEY:-tts-local}
      AUDIO_TTS_MODEL: tts-1
      AUDIO_TTS_VOICE: ${TTS_DEFAULT_VOICE:-en-US-AriaNeural}
      # File/attachment storage on the stack-wide MinIO instance (see
      # minio-init) instead of the local volume — the sqlite DB, config, etc.
      # still live on openwebui_data below; only uploaded files move to S3.
      STORAGE_PROVIDER: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      S3_SECRET_ACCESS_KEY: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
      S3_REGION_NAME: us-east-1
      S3_BUCKET_NAME: ${OPENWEBUI_S3_BUCKET:-openwebui}
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      proxy:
        condition: service_healthy
      ollama:
        condition: service_healthy
      tts:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  # ── TLS reverse proxy ─────────────────────────────────────────────────────────
  # The one port meant for end users (see docs/adr/0002-proxy-api-authentication.md
  # and docs/adr/0006-tls-reverse-proxy.md). Terminates TLS with a Caddy-managed
  # self-signed cert so nothing crosses the LAN in plaintext, even before you
  # have a real certificate — see the ADR for swapping one in.

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      openwebui:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "https://127.0.0.1:8443/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # ── Monitoring ────────────────────────────────────────────────────────────────

  falkordb-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://falkordb:6379
      REDIS_PASSWORD: ${FALKORDB_PASSWORD:-}
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      graphiti:
        condition: service_healthy
      falkordb-exporter:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  grafana:
    image: grafana/grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      # Default admin/admin otherwise — change before any non-localhost access.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
    volumes:
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/dashboard.json
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

  # ── Backups ───────────────────────────────────────────────────────────────────
  # Periodically snapshots FalkorDB (the graph/vector source of truth) and
  # mirrors the MinIO documents bucket (originals + chat-session archives) to
  # ./backups on the host. This is the automated replacement for the single
  # stale manual `backups/webui-backup-*.db` snapshot found during the
  # production-readiness review — see backup/README.md for restore steps and
  # the retention policy.
  backup:
    build: ./backup
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${DOCS_S3_ACCESS_KEY:-gcor_docs}
      S3_SECRET_KEY: ${DOCS_S3_SECRET_KEY:-gcor_docs_secret}
      S3_BUCKET: ${DOCS_S3_BUCKET:-documents}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      falkordb:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m

volumes:
  falkordb_data:
  openclaw_config:
  openclaw_claude_config:
  openclaw_codex_config:
  openwebui_data:
  ollama_data:
  docs_minio_data:
  caddy_data:
  caddy_config:
